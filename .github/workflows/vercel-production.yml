# Deploys the Next.js app to Vercel (remote build). Use standard Next output (`.next`), not static `out/`.
#
# Add GitHub → Settings → Secrets and variables:
#   VERCEL_TOKEN       — Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID      — Project → Settings → General (or Team ID for team projects)
#   VERCEL_PROJECT_ID  — Project → Settings → General
#
# If the repo is already connected in Vercel, you may prefer Git-only deploys;
# then disable or remove this workflow to avoid two production builds per push.

name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # Opt into Node 24 for any JS-based actions still on the legacy runtime until defaults flip (2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (verify)
        run: npm run build

      - name: Vercel project file (for CLI)
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --yes --prod --token "$VERCEL_TOKEN"

      # Tells Bing (and through it ChatGPT search, Copilot, DuckDuckGo, Yandex) that the site changed. Non-fatal.
      - name: Notify search engines (IndexNow)
        run: |
          SITE=$(jq -r '.site.url' public/data/meta.json)
          KEY=$(jq -r '.site.indexNowKey // empty' public/data/meta.json)
          [ -n "$KEY" ] || { echo "No indexNowKey in meta.json; skipping"; exit 0; }
          jq -n --arg site "$SITE" --arg key "$KEY" '{
            host: ($site | sub("^https?://"; "")),
            key: $key,
            keyLocation: "\($site)/\($key).txt",
            urlList: ["\($site)/", "\($site)/llms.txt", "\($site)/sitemap.xml"]
          }' > indexnow.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json || echo "IndexNow ping failed (non-fatal)"
